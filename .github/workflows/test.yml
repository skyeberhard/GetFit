# Runs the test harness on every working branch and every pull request,
# so a change is known-good before it's merged to main (which is what
# actually ships -- see deploy-pages.yml, which runs these tests again
# right before deploying).
name: Test

on:
  push:
    branches-ignore: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test harness
        run: node scripts/test-harness.js
