# Runs the test harness on every working branch and every pull request,
# so a change is known-good before it's merged to Main (which is what
# actually ships -- see deploy-pages.yml, which runs these tests again
# right before deploying).
name: Test

on:
  push:
    branches-ignore: ["Main", "main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The app is date-heavy and a developer's machine is rarely UTC, so the
    # harness runs under several zones to catch tests (or logic) that only
    # work in one.
    strategy:
      fail-fast: false
      matrix:
        tz: ["UTC", "America/Chicago", "Pacific/Auckland"]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test harness (${{ matrix.tz }})
        run: node scripts/test-harness.js

  cache-bump:
    # A PR that changes app/ must bump CACHE_NAME, or installed copies keep
    # serving the old cached shell.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require a CACHE_NAME bump when app/ changes
        run: node scripts/check-cache-bump.js "origin/${{ github.base_ref }}"
