# Deploys app/ (the TRAIN PWA) to GitHub Pages -- the live app everyone
# who installed it runs. Releases come ONLY from `main`: day-to-day work
# happens on other branches (tested by test.yml) and reaches users only
# when it's merged/pushed to main. The test harness runs again here and
# blocks the deploy if anything fails -- above all the schema-migration
# checks, since a release that upgrades saved data wrong would damage
# every user's history, not just the developer's.
#
# Service workers can't register on file://, so real installability needs
# the app served from a real https origin; opening app/index.html as a
# local file is unaffected either way.
name: Deploy TRAIN to GitHub Pages

on:
  push:
    branches: ["main"]
    paths: ["app/**", "scripts/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run test harness (blocks the release on any failure)
        run: node scripts/test-harness.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # enablement: true asks this step to auto-create the Pages site
          # if none exists yet. The default GITHUB_TOKEN can't CREATE one
          # (only update it) -- creating the site the first time needed a
          # one-time manual step: Settings -> Pages -> Source -> "GitHub
          # Actions". Already done for this repo.
          enablement: true
      - name: Upload app/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
